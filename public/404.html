<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050B12" />
    <title>404 — Page Not Found | UMAR TECH</title>
    <meta name="description" content="The page you are looking for does not exist. Return to the UMAR TECH portfolio of Umar Yahaya Usman." />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root { color-scheme: dark; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #050b12;
        color: #f2f5f8;
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        position: relative;
        overflow: hidden;
        text-align: center;
        padding: 24px;
      }
      body::before {
        content: '';
        position: absolute;
        inset: 0;
        background:
          radial-gradient(600px 340px at 50% 12%, rgba(39, 191, 255, 0.10), transparent 70%),
          radial-gradient(900px 500px at 50% 110%, rgba(8, 21, 34, 0.9), transparent 70%);
        pointer-events: none;
      }
      main { position: relative; max-width: 560px; }
      .mark {
        width: 56px; height: 56px; margin: 0 auto 28px; display: block;
      }
      .code {
        font-size: clamp(4.5rem, 16vw, 8rem);
        font-weight: 700;
        letter-spacing: -0.04em;
        line-height: 1;
        background: linear-gradient(180deg, #f2f5f8 20%, rgba(242, 245, 248, 0.25));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .code span { color: #27bfff; -webkit-text-fill-color: #27bfff; }
      h1 { font-size: clamp(1.1rem, 3vw, 1.5rem); font-weight: 600; letter-spacing: 0.02em; margin: 14px 0 10px; }
      p { color: #93a1af; font-size: 0.95rem; line-height: 1.7; margin-bottom: 34px; }
      a.btn {
        display: inline-flex; align-items: center; gap: 10px;
        padding: 14px 26px; border: 1px solid rgba(39, 191, 255, 0.45); border-radius: 999px;
        color: #27bfff; text-decoration: none; font-size: 0.78rem; font-weight: 600; letter-spacing: 0.22em;
        transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease;
      }
      a.btn:hover, a.btn:focus-visible { background: #27bfff; color: #050b12; border-color: #27bfff; outline: none; }
      a.btn:focus-visible { box-shadow: 0 0 0 3px rgba(39, 191, 255, 0.35); }
      .rule { width: 64px; height: 1px; background: linear-gradient(90deg, transparent, #27bfff, transparent); margin: 0 auto 26px; }
    </style>
  </head>
  <body>
    <main>
      <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
        <rect width="64" height="64" rx="14" fill="#081522"/>
        <path d="M19 17v18a13 13 0 0 0 26 0V17" fill="none" stroke="#F2F5F8" stroke-width="5" stroke-linecap="round"/>
        <path d="M25 25l7 8 7-8M32 33v12" fill="none" stroke="#27BFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="code" aria-hidden="true">4<span>0</span>4</div>
      <div class="rule" aria-hidden="true"></div>
      <h1>This page drifted off the grid.</h1>
      <p>The page you are looking for does not exist or has moved. Head back to the portfolio to explore AI content, design work, and digital experiments by Umar Yahaya Usman.</p>
      <a class="btn" href="/">RETURN HOME ↩</a>
    </main>
  </body>
</html>
